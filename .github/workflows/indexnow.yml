name: IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    name: Notify Bing of changed URLs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm run build
      - name: Submit sitemap URLs
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';

          const host = 'www.adrian-alvarez.com';
          const key = '59f7c7ccca1744c980a0a1638d246e89';
          const xml = readFileSync('dist/sitemap-0.xml', 'utf8');
          // the whole sitemap: at 68 URLs it is cheaper than diffing, and IndexNow dedupes
          const urlList = [...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map((match) => match[1]);

          const response = await fetch('https://api.indexnow.org/indexnow', {
            method: 'POST',
            headers: { 'content-type': 'application/json; charset=utf-8' },
            body: JSON.stringify({
              host,
              key,
              keyLocation: `https://${host}/${key}.txt`,
              urlList,
            }),
          });

          console.log(`IndexNow responded ${response.status} for ${urlList.length} URLs`);
          if (!response.ok) process.exit(1);
          EOF
