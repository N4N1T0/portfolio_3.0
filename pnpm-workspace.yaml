  - fallow@3.34.1
  - globals@17.13.0
  - lefthook@2.2.2
  - preact@11.0.1
  - prettier@3.9.10
  - prettier-plugin-astro@1.1.1
  - prettier-plugin-tailwindcss@0.8.1
  - sharp@0.35.5
  - tailwindcss@4.3.3
  - typescript@5.9.3
  - typescript-eslint@8.72.0
  - wawoff2@2.0.1
