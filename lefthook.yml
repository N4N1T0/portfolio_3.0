# yaml-language-server: $schema=https://lefthook.dev/schema.json

pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: '*.{js,ts,astro,css,json,md,yml,yaml}'
      exclude: 'pnpm-lock.yaml'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

    - name: eslint
      glob: '*.{js,ts,astro}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true

pre-push:
  parallel: false
  jobs:
    - name: types
      run: pnpm run check:types

    - name: astro
      run: pnpm run check:astro
